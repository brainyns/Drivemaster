# ── MongoDB ─────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# ── JWT ─────────────────────────────────────────
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration-ms=1800000
security.jwt.refresh-expiration-ms=86400000

# ── Proxy (Render) ──────────────────────────────
server.forward-headers-strategy=native

# ── Sessions ────────────────────────────────────
security.session.max-inactive-minutes=30
security.session.max-conexiones=3
security.session.max-intentos=5
security.session.bloqueo-minutos=15

# ── POSTGRESQL ───────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ── Parámetros ──────────────────────────────────
ESTADO_VENTA_DEFAULT=PAGADA

# ── Multipart / File Upload ─────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Clave secreta del servidor para guardar los códigos de retiro (HMAC-SHA256). Definir RETIRO_CODIGO_SECRET.
retiro.codigo.secret=${RETIRO_CODIGO_SECRET:}

# ── Brevo (Email API) ───────────────────────────
brevo.api.key=${BREVO_API_KEY:}
# Remitente: debe estar verificado en Brevo. Si no se define BREVO_SENDER_EMAIL se usa SPRING_MAIL_USERNAME.
brevo.sender.email=${BREVO_SENDER_EMAIL:${SPRING_MAIL_USERNAME:}}
brevo.sender.name=${BREVO_SENDER_NAME:DriveMaster}
# SOLO desarrollo (ambas apagadas por defecto):
# mail.dev-log: registra asunto y destinatario de cada correo y SIGUE enviando; con llaves pub_test_ de Wompi
#   escribe también el código de retiro en el log del backend.
# mail.dev-skip-send: no envía ningún correo.
mail.dev-log=${MAIL_DEV_LOG:false}
mail.dev-skip-send=${MAIL_DEV_SKIP_SEND:false}

# ── Gemini ──────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.1-flash-lite
gemini.rate.limit.ms=4000

# ── Cloudinary ──────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=drivemaster/productos

# ─── Mantenimiento preventivo ──────────────────────────────
# Cada cuántos km se avisa al cliente (si se deja vacío, usa 5000 al crear el vehículo).
mantenimiento.intervalo.km.default=5000
# Barrido diario de recordatorios. 08:00 por defecto.
mantenimiento.cron=0 0 8 * * *
# Días mínimos entre dos correos del mismo vehículo, para no repetir el aviso cada día.
mantenimiento.diasEntreRecordatorios=30

# ── Google OAuth2 ───────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

google.client-id=${GOOGLE_CLIENT_ID}


# ── Wompi metodo de pagos ───────────────────────────────
wompi.public_key=${WOMPI_PUBLIC_KEY}
wompi.integrity_key=${WOMPI_INTEGRITY_KEY}
wompi.api_url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
wompi.checkout_url=https://checkout.wompi.co/p/
wompi.redirect_url=${WOMPI_REDIRECT_URL}


# ── Frontend ────────────────────────────────────
frontend.url=${FRONTEND_URL}

# ── Datos de demostración (solo desarrollo) ─────
# Crea el cliente y los talleres demo con contraseñas conocidas. NUNCA en producción.
drivemaster.demo-seed.enabled=${DEMO_SEED_ENABLED:false}

# ── Pago simulado (solo desarrollo) ─────
# Da por aprobado un pago del marketplace sin Wompi. Exige además llaves pub_test_. NUNCA en producción.
drivemaster.pago-simulado.enabled=${PAGO_SIMULADO_ENABLED:false}

# ── Verificación manual del pago ("Ya pagué, verificar mi pago") (solo desarrollo) ─────
# Solo se ofrece si además no hay redirect-url (localhost) y las llaves son pub_test_. NUNCA en producción.
drivemaster.pago-verificacion-manual.enabled=${PAGO_VERIFICACION_MANUAL_ENABLED:false}

# ── Dispersión (liquidación a talleres y tiendas) ─────
# SIMULADO (por defecto): automática, referencias SIM-…; solo arranca con llaves pub_test_.
# MANUAL: el ADMIN paga por el banco y anota el número de transferencia (producción).
dispersion.modo=${DISPERSION_MODO:SIMULADO}
