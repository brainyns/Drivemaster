# ── MongoDB ─────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# ── JWT ─────────────────────────────────────────
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration-ms=1800000
security.jwt.refresh-expiration-ms=86400000

# ── Proxy (Render) ──────────────────────────────
server.forward-headers-strategy=native

# ── Sessions ────────────────────────────────────
security.session.max-inactive-minutes=30
security.session.max-conexiones=3
security.session.max-intentos=5
security.session.bloqueo-minutos=15

# ── POSTGRESQL ───────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El Session pooler de Supabase admite 15 clientes en total (backend, n8n y redespliegues).
# Hikari abre 10 por defecto: con 5 y liberando las inactivas queda margen para lo demás.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=120000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ── Parámetros ──────────────────────────────────
ESTADO_VENTA_DEFAULT=PAGADA

# ── Multipart / File Upload ─────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Clave secreta del servidor para guardar los códigos de retiro (HMAC-SHA256). Definir RETIRO_CODIGO_SECRET.
retiro.codigo.secret=${RETIRO_CODIGO_SECRET:}

# Migración única de compras y proveedores sin dueño hacia una tienda (ver MIGRACIONES_PENDIENTES.md).
# Apagada por defecto: solo corre con MIGRAR_COMPRAS_PROVEEDORES=true y una tienda destino.
migracion.compras-proveedores.ejecutar=${MIGRAR_COMPRAS_PROVEEDORES:false}
migracion.compras-proveedores.tienda=${MIGRAR_COMPRAS_PROVEEDORES_TIENDA:}
migracion.compras-proveedores.simular=${MIGRAR_COMPRAS_PROVEEDORES_SIMULAR:false}

# Limpieza de la antigua "Tienda DriveMaster" (ver MIGRACIONES_PENDIENTES.md). Apagada por defecto: solo corre con
# MIGRAR_LIMPIEZA_TIENDA_PROPIA=true; con MIGRAR_LIMPIEZA_TIENDA_PROPIA_SIMULAR=true solo cuenta y no borra nada.
migracion.limpieza-tienda-propia.ejecutar=${MIGRAR_LIMPIEZA_TIENDA_PROPIA:false}
migracion.limpieza-tienda-propia.simular=${MIGRAR_LIMPIEZA_TIENDA_PROPIA_SIMULAR:false}

# ── Brevo (Email API) ───────────────────────────
brevo.api.key=${BREVO_API_KEY:}
# Remitente: debe estar verificado en Brevo. Si no se define BREVO_SENDER_EMAIL se usa SPRING_MAIL_USERNAME.
brevo.sender.email=${BREVO_SENDER_EMAIL:${SPRING_MAIL_USERNAME:}}
brevo.sender.name=${BREVO_SENDER_NAME:DriveMaster}
# SOLO desarrollo (ambas apagadas por defecto):
# mail.dev-log: registra asunto y destinatario de cada correo y SIGUE enviando; con llaves pub_test_ de Wompi
#   escribe también el código de retiro en el log del backend.
# mail.dev-skip-send: no envía ningún correo.
mail.dev-log=${MAIL_DEV_LOG:false}
mail.dev-skip-send=${MAIL_DEV_SKIP_SEND:false}

# ── Marca (correos y PDF) ───────────────────────
# Correos y PDF: blanco con el naranja principal del frontend (--primary de src/css/global.css) en
# títulos, totales, botones y franjas, y texto blanco sobre el naranja.
brand.name=DriveMaster
brand.color.primary=#F28C28
brand.color.on-primary=#FFFFFF
# Nombre "DriveMaster" del encabezado (como el texto oscuro de la página, con el punto naranja).
brand.color.text=#17191C
# URL pública (https) del logo para los correos y el PDF. Vacía: se muestra el nombre en texto.
brand.logo-url=${BRAND_LOGO_URL:}
# Ancho del logo en el correo (px). 160 para la imagen con margen; unos 80 si la imagen está recortada.
brand.logo-width=${BRAND_LOGO_WIDTH:160}

# ── n8n (chat IA) ────────────────────────────────
# El backend ya no llama a Gemini: reenvía el chat al webhook de n8n, que aloja el agente
# (modelo, herramientas y memoria). La API key de OpenRouter va en las credenciales de n8n.
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/chat-drivemaster}
n8n.chat.secret=${N8N_CHAT_SECRET:}
# Asistente de la TIENDA (panel de Informes): otro workflow, mismo secreto.
n8n.asistente-tienda.url=${N8N_ASISTENTE_TIENDA_URL:http://localhost:5678/webhook/asistente-tienda}
n8n.tools.secret=${N8N_TOOLS_SECRET:}
# Topes del chat: cada mensaje cuesta tokens del modelo. El global por día acota el gasto máximo diario.
n8n.chat.rate.max-por-minuto=${N8N_CHAT_RATE_MAX:6}
n8n.chat.rate.max-por-dia-ip=${N8N_CHAT_RATE_DIA_IP:60}
n8n.chat.rate.max-por-dia-global=${N8N_CHAT_RATE_DIA_GLOBAL:400}
n8n.chat.max-caracteres=${N8N_CHAT_MAX_CARACTERES:500}

# ── Cloudinary ──────────────────────────────────
# Vacías: el backend arranca, pero subir imágenes de productos falla hasta definirlas.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=drivemaster/productos

# ── Tareas de fondo (varios servidores con la misma base) ─────
# Render y el HomeLab comparten Mongo y Supabase: solo UNO debe ejecutar las tareas programadas (vencimientos y
# reasignación de solicitudes, despachos atrasados, autoconfirmación de envíos, recordatorios de mantenimiento) y la
# migración de arranque MarketplaceMigration. Los recordatorios de mantenimiento se duplicarían si corren en los dos.
# true por defecto (un solo servidor no necesita definirla); en el otro servidor, TAREAS_PROGRAMADAS_ENABLED=false.
drivemaster.tareas-programadas.enabled=${TAREAS_PROGRAMADAS_ENABLED:true}

# ─── Mantenimiento preventivo ──────────────────────────────
# Cada cuántos km se avisa al cliente (si se deja vacío, usa 5000 al crear el vehículo).
mantenimiento.intervalo.km.default=5000
# Barrido diario de recordatorios. 08:00 por defecto.
mantenimiento.cron=0 0 8 * * *
# Resumen semanal de las tiendas que lo activaron (hora de Colombia).
tienda.resumen-semanal.cron=${TIENDA_RESUMEN_SEMANAL_CRON:0 0 7 * * MON}
# Días mínimos entre dos correos del mismo vehículo, para no repetir el aviso cada día.
mantenimiento.diasEntreRecordatorios=30

# ── Google (inicio de sesión) ───────────────────
# GoogleAuthService verifica el ID token que envía el frontend contra este client-id (debe ser el mismo
# que VITE_GOOGLE_CLIENT_ID). No se usa oauth2Login, así que no hay registro spring.security.oauth2.client:
# con él, un client-id vacío impedía arrancar. Vacío: el resto funciona y solo falla el botón de Google.
google.client-id=${GOOGLE_CLIENT_ID:}


# ── Wompi metodo de pagos ───────────────────────────────
# Sin WOMPI_PUBLIC_KEY (o con llaves de producción) el arranque exige RETIRO_CODIGO_SECRET y DISPERSION_MODO=MANUAL
# (ver CodigoRetiroConfig y DispersionConfig): es a propósito, para no correr en modo de pruebas con dinero real.
wompi.public_key=${WOMPI_PUBLIC_KEY:}
wompi.integrity_key=${WOMPI_INTEGRITY_KEY:}
wompi.api_url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
wompi.checkout_url=https://checkout.wompi.co/p/
# Vacía: se usa la redirect-url que manda el frontend (o ninguna, en local).
wompi.redirect_url=${WOMPI_REDIRECT_URL:}


# ── Mapas ───────────────────────────────────────
# OSRM (rutas en carro) para refinar los talleres más cercanos con el tiempo real. El servidor público de
# demostración admite una petición por segundo; en el HomeLab se puede apuntar a uno propio.
osrm.url=${OSRM_URL:https://router.project-osrm.org}

# ── Frontend ────────────────────────────────────
# URL pública del frontend, sin "/" final: enlaces de los correos, regreso tras pagar y origen extra
# permitido en CORS y WebSocket. El valor por defecto solo sirve en local: en cada despliegue hay que definirla.
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Datos de demostración (solo desarrollo) ─────
# Crea el cliente y los talleres demo con contraseñas conocidas. NUNCA en producción.
drivemaster.demo-seed.enabled=${DEMO_SEED_ENABLED:false}

# ── Pago simulado (solo desarrollo) ─────
# Da por aprobado un pago del marketplace sin Wompi. Exige además llaves pub_test_. NUNCA en producción.
drivemaster.pago-simulado.enabled=${PAGO_SIMULADO_ENABLED:false}

# ── Verificación manual del pago ("Ya pagué, verificar mi pago") (solo desarrollo) ─────
# Solo se ofrece si además no hay redirect-url (localhost) y las llaves son pub_test_. NUNCA en producción.
drivemaster.pago-verificacion-manual.enabled=${PAGO_VERIFICACION_MANUAL_ENABLED:false}

# ── Dispersión (liquidación a talleres y tiendas) ─────
# SIMULADO (por defecto): automática, referencias SIM-…; solo arranca con llaves pub_test_.
# MANUAL: el ADMIN paga por el banco y anota el número de transferencia (producción).
dispersion.modo=${DISPERSION_MODO:SIMULADO}
