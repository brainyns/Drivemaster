# ── MongoDB ─────────────────────────────────────

spring.data.mongodb.uri=${MONGO_URI}

# ── JWT ─────────────────────────────────────────

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=1800000
security.jwt.refresh-expiration-ms=86400000

# ── Sesiones ────────────────────────────────────

security.session.max-inactive-minutes=30
security.session.max-conexiones=3
security.session.max-intentos=5
security.session.bloqueo-minutos=15

# ── MySQL Railway ───────────────────────────────

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Parámetros ──────────────────────────────────

ESTADO_VENTA_DEFAULT=PAGADA

# ── Gmail SMTP ──────────────────────────────────

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Gemini ──────────────────────────────────────

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.1-flash-lite
gemini.rate.limit.ms=4000

# ── Google OAuth2 ───────────────────────────────

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

google.client-id=${GOOGLE_CLIENT_ID}