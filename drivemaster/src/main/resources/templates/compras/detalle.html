<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Compra</title>
</head>
<body>

<h1>Detalle de Compra</h1>

<h3>Información General</h3>

<p><b>ID Compra:</b> <span th:text="${compra.id}"></span></p>
<p><b>Fecha:</b> <span th:text="${compra.fecha}"></span></p>
<p><b>Proveedor ID:</b> <span th:text="${compra.proveedorId}"></span></p>
<p><b>Usuario ID:</b> <span th:text="${compra.usuarioId}"></span></p>
<p><b>Total:</b> <span th:text="${compra.total}"></span></p>

<h3>Productos Comprados</h3>

<table border="1">
    <tr>
        <th>Producto ID</th>
        <th>Nombre</th>
        <th>Costo</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
    </tr>

    <tr th:each="d : ${compra.productos}">
        <td th:text="${d.productoId}"></td>
        <td th:text="${d.nombre}"></td>
        <td th:text="${d.costo}"></td>
        <td th:text="${d.cantidad}"></td>
        <td th:text="${d.subtotal}"></td>
    </tr>
</table>

<br>

<a th:href="@{/compras}">Volver a compras</a>

</body>
</html>
