<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kardex</title>
</head>
<body>

<h1>Movimientos de Inventario</h1>

<form th:action="@{/movimientos}" method="get">

    Producto:
    <select name="productoId">
        <option value="">-- Todos --</option>

        <option th:each="p : ${productosDisponibles}"
                th:value="${p.id}"
                th:text="${p.nombre}"
                th:selected="${p.id == productoIdSeleccionado}">
        </option>
    </select>

    Tipo:
    <select name="tipo">
        <option value="">-- Todos --</option>

        <option value="ENTRADA"
                th:selected="${tipoSeleccionado == 'ENTRADA'}">
            ENTRADA
        </option>

        <option value="SALIDA"
                th:selected="${tipoSeleccionado == 'SALIDA'}">
            SALIDA
        </option>

        <option value="AJUSTE"
                th:selected="${tipoSeleccionado == 'AJUSTE'}">
            AJUSTE
        </option>
    </select>

    Desde:
    <input type="date"
           name="fechaInicio"
           th:value="${fechaInicio}" />

    Hasta:
    <input type="date"
           name="fechaFin"
           th:value="${fechaFin}" />

    <button type="submit">Filtrar</button>

</form>

<br>

<table border="1">

    <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Stock Antes</th>
        <th>Stock Después</th>
        <th>Motivo</th>
        <th>Referencia</th>
    </tr>

    <tr th:each="m : ${movimientos}">

        <td th:text="${m.fecha}"></td>

        <td th:text="${m.tipo}"></td>

        <td th:text="${nombreProductoPorId[m.productoId]} ?: '(Producto no encontrado)'"></td>

        <td th:text="${m.cantidad}"></td>

        <td th:text="${m.stockAnterior}"></td>

        <td th:text="${m.stockNuevo}"></td>

        <td th:text="${m.motivo}"></td>

        <td th:text="${m.referencia}"></td>

    </tr>

</table>

<br>

<a th:href="@{/}">Menú principal</a>

</body>
</html>
