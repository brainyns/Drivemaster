<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Venta</title>
</head>
<body>

<h1>Detalle de Venta</h1>

<h3>Información General</h3>

<p><b>ID Venta:</b> <span th:text="${venta.id}"></span></p>
<p><b>Fecha:</b> <span th:text="${venta.fecha}"></span></p>
<p><b>Cliente ID:</b> <span th:text="${venta.clienteId}"></span></p>
<p><b>Usuario ID:</b> <span th:text="${venta.usuarioId}"></span></p>
<p><b>Estado:</b> <span th:text="${venta.estado}"></span></p>
<p><b>Total:</b> <span th:text="${venta.total}"></span></p>

<h3>Productos Vendidos</h3>

<table border="1">

    <tr>
        <th>Producto ID</th>
        <th>Nombre</th>
        <th>Precio Unitario</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
    </tr>

    <tr th:each="d : ${venta.productos}">

        <td th:text="${d.productoId}"></td>

        <td th:text="${d.nombre} ?: '(Sin nombre)'"></td>

        <td th:text="${d.precioUnitario}"></td>

        <td th:text="${d.cantidad}"></td>

        <td th:text="${d.subtotal}"></td>

    </tr>

</table>

<h3>Pagos</h3>

<table border="1">

    <tr>
        <th>Método</th>
        <th>Monto</th>
    </tr>

    <tr th:each="p : ${venta.pagos}">

        <td th:text="${p.metodo}"></td>

        <td th:text="${p.monto}"></td>

    </tr>

</table>

<br>

<a th:href="@{/ventas}">Volver a ventas</a>

</body>
</html>
