<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Ventas</title>
</head>
<body>

<h1>Lista de Ventas</h1>

<a th:href="@{/ventas/nueva}">Registrar nueva venta</a>


<br><br>

<table border="1">
    <tr>
        <th>Fecha</th>
        <th>Cliente</th>
        <th>Total</th>
        <th>Estado</th>
        <th># Productos</th>
        <th>Acciones</th>
    </tr>

    <tr th:each="v : ${ventas}">
        <td th:text="${v.fecha}"></td>
        <td th:text="${v.clienteId}"></td>
        <td th:text="${v.total}"></td>
        <td th:text="${v.estado}"></td>
        <td th:text="${#lists.size(v.productos)}"></td>

        <td>
            <a th:href="@{/ventas/detalle/{id}(id=${v.id})}">Ver detalle</a>
        </td>
    </tr>
</table>

<br>

<a th:href="@{/}">Volver al inicio</a>

</body>
</html>
