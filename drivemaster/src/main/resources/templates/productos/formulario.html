<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Producto</title>
</head>
<body>

<h1>Registrar Producto</h1>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

    <label>Código:</label><br>
    <input type="text" th:field="*{codigo}" required />
    <br><br>

    <label>Nombre:</label><br>
    <input type="text" th:field="*{nombre}" required />
    <br><br>

    <label>Categoría:</label><br>
    <input type="text" th:field="*{categoria}" />
    <br><br>

    <label>Marca:</label><br>
    <input type="text" th:field="*{marca}" />
    <br><br>

    <label>Precio Compra:</label><br>
    <input type="number" step="0.01" th:field="*{precioCompra}" />
    <br><br>

    <label>Precio Venta:</label><br>
    <input type="number" step="0.01" th:field="*{precioVenta}" />
    <br><br>

    <label>Stock Inicial:</label><br>
    <input type="number" th:field="*{stockActual}" />
    <br><br>

    <label>Stock Mínimo:</label><br>
    <input type="number" th:field="*{stockMinimo}" />
    <br><br>

    <h3>Compatibilidad de Modelos</h3>

    <div id="compatibilidades">

        <!-- Compatibilidades existentes -->
        <div th:each="c, stat : *{modelosCompatibles}">

            Marca:
            <input type="text"
                   th:field="*{modelosCompatibles[__${stat.index}__].marca}" />

            Modelo:
            <input type="text"
                   th:field="*{modelosCompatibles[__${stat.index}__].modelo}" />

            Año Desde:
            <input type="number"
                   th:field="*{modelosCompatibles[__${stat.index}__].anoDesde}" />

            Año Hasta:
            <input type="number"
                   th:field="*{modelosCompatibles[__${stat.index}__].anoHasta}" />

            <br><br>

        </div>

    </div>

    <button type="button" onclick="agregarCompatibilidad()">
        Agregar compatibilidad
    </button>

    <br><br>

    <button type="submit">Guardar Producto</button>

</form>

<br>

<a th:href="@{/productos}">Lista de productos</a>


<script>

function agregarCompatibilidad() {

    const index =
        document.querySelectorAll('#compatibilidades > div').length;

    const div = document.createElement('div');

    div.innerHTML = `
        Marca:
        <input type="text"
               name="modelosCompatibles[${index}].marca" />

        Modelo:
        <input type="text"
               name="modelosCompatibles[${index}].modelo" />

        Año Desde:
        <input type="number"
               name="modelosCompatibles[${index}].anoDesde" />

        Año Hasta:
        <input type="number"
               name="modelosCompatibles[${index}].anoHasta" />

        <br><br>
    `;

    document
        .getElementById('compatibilidades')
        .appendChild(div);
}

</script>

</body>
</html>
