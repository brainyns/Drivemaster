# DriveMaster en el HomeLab (VM Linux dentro de Proxmox), desplegado como stack de Portainer.
#
#   Internet ─► Cloudflare ─► cloudflared ─► frontend (nginx :80) ─┬─► /            archivos de React
#                                                                   ├─► /api/...     backend :8080
#                                                                   └─► /ws/...      backend :8080 (WebSocket)
#                                            backend ─► mongo :27017  y  postgres :5432
#
# Solo nginx publica un puerto en la VM (para probar desde la LAN). Mongo, Postgres y el backend
# quedan en la red interna de Docker: nadie de fuera puede conectarse a ellos.
#
# Pensado para Portainer (Stacks → Add stack → Repository, Compose path: homelab/docker-compose.yml):
#   - Las variables se cargan en el editor de variables de Portainer (ver .env.example). No se usa
#     env_file: en un stack de Git el .env no existe (no está en el repositorio).
#   - nginx.conf va dentro de la imagen del frontend (homelab/frontend.Dockerfile), porque Portainer CE
#     no permite montar archivos del repositorio con rutas relativas.
#
# También funciona sin Portainer, desde esta carpeta:  docker compose --env-file .env up -d --build

name: drivemaster

services:

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    # Limita la caché de WiredTiger: por defecto usa ~50 % de la RAM de la VM.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-drivemasterDB}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-drivemaster}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../drivemaster
    image: drivemaster-backend:latest
    restart: unless-stopped
    environment:
      # Se arman aquí para que las contraseñas se escriban una sola vez.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-drivemasterDB}?authSource=admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-drivemaster}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      RETIRO_CODIGO_SECRET: ${RETIRO_CODIGO_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-DriveMaster}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_INTEGRITY_KEY: ${WOMPI_INTEGRITY_KEY}
      WOMPI_API_URL: ${WOMPI_API_URL:-https://sandbox.wompi.co/v1}
      WOMPI_REDIRECT_URL: ${WOMPI_REDIRECT_URL}
      DISPERSION_MODO: ${DISPERSION_MODO:-SIMULADO}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      PAGO_SIMULADO_ENABLED: ${PAGO_SIMULADO_ENABLED:-false}
      PAGO_VERIFICACION_MANUAL_ENABLED: ${PAGO_VERIFICACION_MANUAL_ENABLED:-false}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-false}
      MAIL_DEV_SKIP_SEND: ${MAIL_DEV_SKIP_SEND:-false}
      # La JVM usa como máximo el 75 % del límite de memoria del contenedor.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: America/Bogota
    mem_limit: 1g
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      # Contexto = raíz del repo, para que la imagen incluya también homelab/nginx.conf.
      context: ..
      dockerfile: homelab/frontend.Dockerfile
      args:
        # Mismo dominio público: nginx reenvía /api y /ws al backend, así no hay CORS entre dominios.
        VITE_API_URL: ${PUBLIC_URL}
    image: drivemaster-frontend:latest
    restart: unless-stopped
    ports:
      # Acceso de prueba desde la LAN: http://IP-DE-LA-VM:8088
      - "${LAN_PORT:-8088}:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Sin CLOUDFLARE_TUNNEL_TOKEN el contenedor se cierra y se reintenta cada pocos segundos; no
    # afecta al resto. Hasta la fase del túnel puedes detenerlo desde Portainer.
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  mongo-data:
  postgres-data:
