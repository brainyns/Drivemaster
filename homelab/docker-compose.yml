# DriveMaster en el HomeLab (VM Linux dentro de Proxmox), desplegado como stack de Portainer.
#
#   Internet ─► Tailscale Funnel / Cloudflare ─► frontend (nginx :80) ─┬─► /         archivos de React
#                                                                       ├─► /api/...  backend :8080
#                                                                       └─► /ws/...   backend :8080 (WebSocket)
#                                               backend ─► MongoDB Atlas  y  Supabase (PostgreSQL), en la nube
#
# Las bases de datos NO corren aquí: el backend se conecta a Atlas y Supabase (las mismas que usaba Render).
# Solo nginx publica un puerto en la VM; el backend queda en la red interna de Docker.
#
# Pensado para Portainer (Stacks → Add stack → Repository, Compose path: homelab/docker-compose.yml):
#   - Las variables se cargan en el editor de variables de Portainer (ver .env.example). No se usa
#     env_file: en un stack de Git el .env no existe (no está en el repositorio).
#   - nginx.conf va dentro de la imagen del frontend (homelab/frontend.Dockerfile), porque Portainer CE
#     no permite montar archivos del repositorio con rutas relativas.
#
# También funciona sin Portainer, desde esta carpeta:  docker compose --env-file .env up -d --build

name: drivemaster

services:

  backend:
    build: ../drivemaster
    image: drivemaster-backend:latest
    # Portainer: compilar siempre al desplegar, en vez de reutilizar la imagen que ya existe.
    pull_policy: build
    restart: unless-stopped
    environment:
      # MongoDB Atlas y Supabase: los mismos valores que tenías en Render.
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      RETIRO_CODIGO_SECRET: ${RETIRO_CODIGO_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-DriveMaster}
      # Chat IA: el backend solo reenvía a n8n. La API key de Groq va en las credenciales de n8n.
      # Los dos secretos son obligatorios: sin ellos el despliegue falla en vez de usar un valor
      # conocido (los que había por defecto están publicados en el repositorio).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/chat-drivemaster}
      N8N_CHAT_SECRET: ${N8N_CHAT_SECRET:?Define N8N_CHAT_SECRET en las variables del stack}
      N8N_TOOLS_SECRET: ${N8N_TOOLS_SECRET:?Define N8N_TOOLS_SECRET en las variables del stack}
      N8N_CHAT_RATE_MAX: ${N8N_CHAT_RATE_MAX:-15}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_INTEGRITY_KEY: ${WOMPI_INTEGRITY_KEY}
      WOMPI_API_URL: ${WOMPI_API_URL:-https://sandbox.wompi.co/v1}
      WOMPI_REDIRECT_URL: ${WOMPI_REDIRECT_URL}
      DISPERSION_MODO: ${DISPERSION_MODO:-SIMULADO}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      PAGO_SIMULADO_ENABLED: ${PAGO_SIMULADO_ENABLED:-false}
      PAGO_VERIFICACION_MANUAL_ENABLED: ${PAGO_VERIFICACION_MANUAL_ENABLED:-false}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-false}
      MAIL_DEV_SKIP_SEND: ${MAIL_DEV_SKIP_SEND:-false}
      # La JVM usa como máximo el 75 % del límite de memoria del contenedor.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: America/Bogota
    mem_limit: 1g

  frontend:
    build:
      # Contexto = raíz del repo, para que la imagen incluya también homelab/nginx.conf.
      context: ..
      dockerfile: homelab/frontend.Dockerfile
      args:
        # Mismo dominio público: nginx reenvía /api y /ws al backend, así no hay CORS entre dominios.
        VITE_API_URL: ${PUBLIC_URL}
    image: drivemaster-frontend:latest
    pull_policy: build
    restart: unless-stopped
    ports:
      # Acceso de prueba desde la LAN y destino de Tailscale Funnel: http://IP-DE-LA-VM:8088
      - "${LAN_PORT:-8088}:80"
    depends_on:
      - backend

  # Chat IA: agente en n8n (modelo de Groq, memoria y herramientas). El puerto 5678 solo
  # se publica en localhost de la VM: ábrelo por túnel SSH (ssh -L 5678:localhost:5678), nunca
  # con Funnel ni Cloudflare. Importa n8n/workflows/chat-drivemaster.json desde el editor.
  n8n:
    # Fija N8N_VERSION en Portainer con la versión que ya corre (Settings → About en n8n):
    # con "latest", un "Pull and redeploy" puede subir de versión mayor sin aviso.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_DIAGNOSTICS_ENABLED=false
      # El workflow lee secretos y URLs con $env; desde n8n 2.0 eso está bloqueado por defecto.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_CHAT_SECRET=${N8N_CHAT_SECRET:?Define N8N_CHAT_SECRET en las variables del stack}
      - N8N_TOOLS_SECRET=${N8N_TOOLS_SECRET:?Define N8N_TOOLS_SECRET en las variables del stack}
      - N8N_TOOLS_BASE_URL=http://backend:8080
      # Modelo de Groq (debe soportar herramientas / tool use).
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Sin CLOUDFLARE_TUNNEL_TOKEN el contenedor se cierra y se reintenta cada pocos segundos; no
    # afecta al resto. Mientras uses Tailscale Funnel puedes detenerlo desde Portainer.
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  # Workflows, ejecuciones y credenciales de n8n. Se respalda con homelab/backup.sh.
  n8n_data:
