# nginx del contenedor "frontend": sirve la SPA de React y reenvía la API al backend.

# Para el WebSocket: si el navegador pide "Upgrade", se reenvía; si no, se cierra normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare ya manda X-Forwarded-Proto=https; si se entra por la LAN no viene y se usa http.
map $http_x_forwarded_proto $proto_reenviado {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Igual que spring.servlet.multipart.max-request-size (10MB) con algo de margen.
    client_max_body_size 12m;

    # Cabeceras comunes hacia el backend. Spring las lee gracias a
    # server.forward-headers-strategy=native (ya está en application.properties).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_reenviado;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 120s;   # el chat con IA y los reportes pueden tardar
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;     # conexión de notificaciones abierta mucho tiempo
    }

    # Archivos con hash en el nombre (Vite): se pueden guardar en caché mucho tiempo.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta (/catalogo, /admin/...) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
